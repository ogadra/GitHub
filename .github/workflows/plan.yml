name: Plan

on:
  pull_request:

permissions: {}

concurrency:
  group: terraform

jobs:
  list-repositories:
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.PAT }}

      - id: repositories
        run: |
          repositories=$(
            gh pr diff "${{ github.event.pull_request.number }}" --name-only \
              | awk -F/ '$1 == "repositories" && $2 != "" { print $2 }' \
              | sort -u \
              | while read -r repository; do
                  [ -d "repositories/${repository}" ] && echo "${repository}"
                done \
              | jq -R -s -c 'split("\n")[:-1]'
          )

          echo "repositories=${repositories}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PAT }}

  plan:
    needs: list-repositories
    if: needs.list-repositories.outputs.repositories != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.list-repositories.outputs.repositories) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/encrypt/go.mod

      - run: go build .
        working-directory: tools/encrypt

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - uses: shmokmt/actions-setup-tfcmt@04d5aa6dc61eaa69a4d00257224c9b97f4857819 # v2.1.1

      - run: find "repositories/${{ matrix.repository }}" -name 'secrets.json.example' -exec sh -c 'cp "$1" "${1%.example}"' _ {} \;

      - run: |
          TF_CLI_ARGS_init= terraform -chdir="repositories/${{ matrix.repository }}" init -upgrade \
            -backend-config="bucket=${{ secrets.R2_BUCKET_NAME }}" \
            -backend-config="key=repositories/${{ matrix.repository }}/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config='endpoints={s3="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_lockfile=true"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - run: |
          tfcmt --var "target:${{ matrix.repository }}" plan --patch --skip-no-changes --disable-label \
            -- terraform -chdir="repositories/${{ matrix.repository }}" plan -no-color
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
